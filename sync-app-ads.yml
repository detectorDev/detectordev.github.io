name: Sync CAS app-ads.txt

on:
  schedule:
    # Каждый день в 04:17 UTC
    - cron: "17 4 * * *"

  # Возможность запустить вручную
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Download current CAS app-ads.txt
        shell: bash
        run: |
          curl \
            --fail \
            --location \
            --retry 3 \
            "https://raw.githubusercontent.com/cleveradssolutions/App-ads.txt/main/app-ads.txt" \
            --output app-ads.txt.new

          test -s app-ads.txt.new
          mv app-ads.txt.new app-ads.txt

      - name: Monthly keep-alive
        shell: bash
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            mkdir -p .github
            date -u +"%Y-%m-%d" > .github/last-sync
          fi

      - name: Save changes to repository
        shell: bash
        run: |
          git add app-ads.txt

          if [ -f .github/last-sync ]; then
            git add .github/last-sync
          fi

          if git diff --cached --quiet; then
            echo "CAS file has not changed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git commit -m "Sync app-ads.txt with CAS"
            git push
          fi

      - name: Prepare website
        shell: bash
        run: |
          mkdir -p _site
          cp index.html _site/
          cp app-ads.txt _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
