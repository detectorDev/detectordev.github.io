name: Update CAS app-ads.txt

on:
  schedule:
    # Каждый день в 04:17 UTC
    - cron: "17 4 * * *"

  # Позволяет запустить обновление вручную
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download current CAS app-ads.txt
        shell: bash
        run: |
          curl \
            --fail \
            --location \
            --retry 3 \
            --connect-timeout 20 \
            "https://cas.ai/app-ads.txt" \
            --output app-ads.txt.new

          # Защита от случайной загрузки пустой страницы или ошибки
          test -s app-ads.txt.new
          grep -qi "cas.ai" app-ads.txt.new

          mv app-ads.txt.new app-ads.txt

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- app-ads.txt; then
            echo "app-ads.txt is already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app-ads.txt
          git commit -m "Update app-ads.txt from CAS"
          git push
